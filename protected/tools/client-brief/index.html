<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업체 정보 받기 — 바이란미디어</title>
<style>
:root{
  --bg:#F2F4F3;--surface:#FFFFFF;--line:#DCE1DF;--line-soft:#E9EDEB;
  --ink:#161D1A;--ink-2:#5A6663;--ink-3:#8A9793;
  --accent:#2F6F5E;--accent-dark:#265A4C;--accent-soft:#E4F0EB;
  --warn:#A8641C;--warn-soft:#FBF1E3;--danger:#A93E33;
  --mono:'SF Mono','D2Coding',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px 0;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.02em}
.brand .sub{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:none;padding:9px 15px 11px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;min-height:0}
.pane{overflow-y:auto;padding:18px 20px 100px}
.pane.left{border-right:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:13.5px;font-weight:650;margin-bottom:4px}
.card .desc{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-bottom:12px}
.field{margin-top:12px}
label.lb{display:block;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
label.lb .req{color:var(--danger);margin-left:3px}
input[type=text],textarea,select{width:100%;padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:7px}
textarea{resize:vertical;min-height:60px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{padding:8px 13px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.block{display:block;width:100%;text-align:center}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.out{background:#14181A;border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:300px}
.out-top{padding:12px 16px;border-bottom:1px solid #2C3438;display:flex;align-items:center;gap:10px}
.out-top .t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#66756F}
.out-top .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:#66756F}
.out pre{font-family:var(--mono);font-size:12px;line-height:1.75;color:#D6DEDA;white-space:pre-wrap;word-break:break-word;padding:16px;overflow-y:auto;flex:1}

.warn{background:var(--warn-soft);border:1px solid #EEDFC4;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#7C4A13;line-height:1.6;margin-bottom:12px}
.ok{background:var(--accent-soft);border:1px solid #CFE5DC;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#1F4E41;line-height:1.6;margin-bottom:12px}

.checklist{list-style:none}
.checklist li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;line-height:1.6}
.checklist li:last-child{border-bottom:none}
.checklist .mark{flex-shrink:0;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:2px}
.checklist .mark.yes{background:var(--accent-soft);color:var(--accent)}
.checklist .mark.no{background:#FAEBE9;color:var(--danger)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(60px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .22s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-bar{display:none}
@media (max-width:860px){
  .body{grid-template-columns:1fr}
  .pane.left{border-right:none}
  .pane.right{display:none}
  .pane.right.open{display:block;position:fixed;inset:0;top:auto;height:84dvh;z-index:60;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);padding-top:22px}
  .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:8px;align-items:center}
  .mobile-bar .info{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
  .mobile-bar .btn{margin-left:auto}
  .row{grid-template-columns:1fr}
  header{padding:12px 14px 0}
  .pane{padding:14px 14px 120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>업체 정보 받기</h1>
      <span class="sub">없는 사실을 쓰지 않으려면 여기부터</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="ask">질문지 보내기</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="save">받은 정보 정리</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="check">사실 점검</button>
    </div>
  </header>

  <div class="body">
    <div class="pane left" id="form"></div>
    <aside class="pane right" id="out"></aside>
  </div>

  <div class="mobile-bar">
    <span class="info" id="mCount">0자</span>
    <button class="btn" id="btnCloseM" style="display:none">닫기</button>
    <button class="btn primary" id="btnOpenM">결과 보기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const Store={ok:false,mem:{},
  init(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');this.ok=true}catch(e){this.ok=false}},
  get(k){if(this.ok){try{return localStorage.getItem(k)}catch(e){}}return this.mem[k]??null},
  set(k,v){if(this.ok){try{localStorage.setItem(k,v);return}catch(e){}}this.mem[k]=v}};
Store.init();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={
  tab:'ask',
  ask:{ name:'', industry:'', channel:'카카오톡' },
  save:{
    name:'',industry:'',addr:'',hours:'',off:'',tel:'',book:'',park:'',
    menu:'',price:'',feature:'',target:'',faq:'',story:'',photo:'',ban:'',
    raw:''
  }
};

const INDUSTRIES=['음식점 · 카페','병의원 · 한의원','학원 · 교습소','미용 · 네일 · 에스테틱','헬스 · 필라테스','펜션 · 숙박','반려동물','생활서비스 · 수리','부동산 · 인테리어','기타'];

/* ---------- 질문지 ---------- */
function askForm(){
  return `
  <div class="card">
    <h2>사장님께 보낼 질문지</h2>
    <p class="desc">이걸 그대로 복사해서 카카오톡으로 보내세요. 답을 받아야 글에 사실을 쓸 수 있습니다.</p>
    <div class="field">
      <label class="lb" for="a-name">업체명</label>
      <input type="text" id="a-name" data-a="name" value="${esc(S.ask.name)}" placeholder="예: 다다닥솥뚜껑">
    </div>
    <div class="field">
      <label class="lb" for="a-ind">업종</label>
      <select id="a-ind" data-a="industry">
        <option value="">선택 안 함</option>
        ${INDUSTRIES.map(v=>`<option ${S.ask.industry===v?'selected':''}>${esc(v)}</option>`).join('')}
      </select>
      <div class="hint">업종을 고르면 그 업종에서 꼭 물어야 할 항목이 추가됩니다.</div>
    </div>
  </div>
  <div class="ok">
    사장님이 답하기 쉽도록 질문을 짧게 나눴습니다. 한 번에 다 안 오면 온 것부터 쓰고, 빈 항목은 글에서 빼면 됩니다.
  </div>`;
}

const COMMON_Q = [
  ['기본','정확한 상호명이 어떻게 되나요'],
  ['기본','주소를 알려주세요 (건물명·층까지)'],
  ['기본','영업시간과 쉬는 날은 언제인가요'],
  ['기본','브레이크타임이 있나요'],
  ['기본','전화번호와 예약 방법을 알려주세요'],
  ['기본','주차가 되나요? 몇 대까지 가능한가요'],
  ['서비스','대표 메뉴나 서비스 세 가지만 꼽아주세요'],
  ['서비스','가격을 글에 적어도 될까요? 적는다면 어떻게 표기할까요'],
  ['서비스','다른 곳과 다른 점 하나만 말씀해 주세요'],
  ['손님','주로 어떤 분들이 오시나요 (나이대·상황)'],
  ['손님','손님들이 가장 많이 물어보는 질문 세 가지는 뭔가요'],
  ['손님','손님들이 오해하고 오는 게 있나요'],
  ['이야기','이 일을 시작하신 계기가 있나요'],
  ['이야기','최근에 기억에 남는 손님이나 일이 있었나요'],
  ['자료','사진을 보내주실 수 있나요 (외부·내부·메뉴·과정)'],
  ['자료','절대 쓰면 안 되는 표현이나 노출하면 안 되는 정보가 있나요'],
];

const IND_Q = {
  '음식점 · 카페':[['업종','재료는 어디서 받으시나요? 직접 준비하는 게 있나요'],['업종','인분 기준과 양은 어느 정도인가요'],['업종','포장이나 배달이 되나요']],
  '병의원 · 한의원':[['업종','진료 과목과 대표 진료를 알려주세요'],['업종','원장님 경력과 소속 학회를 알려주세요'],['업종','광고 심의를 받으신 문구가 있나요 (심의필 번호)']],
  '학원 · 교습소':[['업종','대상 학년과 과목을 알려주세요'],['업종','한 반 인원과 수업 시간은 어떻게 되나요'],['업종','강사 경력을 알려주세요']],
  '미용 · 네일 · 에스테틱':[['업종','소요 시간이 얼마나 걸리나요'],['업종','예약제인가요 방문 접수도 되나요'],['업종','쓰시는 제품이나 장비 중 알릴 만한 게 있나요']],
  '헬스 · 필라테스':[['업종','수업 형태 (1:1, 소그룹)와 인원을 알려주세요'],['업종','회원권 종류를 알려주세요'],['업종','샤워실·주차 같은 시설이 있나요']],
  '펜션 · 숙박':[['업종','객실 종류와 최대 인원을 알려주세요'],['업종','입실·퇴실 시간을 알려주세요'],['업종','바비큐·수영장 같은 부대시설이 있나요']],
  '반려동물':[['업종','받으시는 견종·묘종에 제한이 있나요'],['업종','소요 시간과 예약 방법을 알려주세요'],['업종','수의사가 상주하나요']],
  '생활서비스 · 수리':[['업종','출장 가능 지역이 어디까지인가요'],['업종','견적은 어떻게 나오나요'],['업종','A/S 기간이 어떻게 되나요']],
  '부동산 · 인테리어':[['업종','주로 다루시는 매물이나 시공 범위를 알려주세요'],['업종','상담부터 완료까지 절차를 알려주세요'],['업종','시공 기간은 보통 얼마나 걸리나요']],
};

function buildAsk(){
  const a=S.ask;
  const qs=[...COMMON_Q, ...(IND_Q[a.industry]||[])];
  const groups={};
  qs.forEach(([g,q])=>{(groups[g]=groups[g]||[]).push(q)});

  let t = `안녕하세요 사장님${a.name?', '+a.name:''} 블로그 원고 준비하면서 몇 가지 여쭤볼게요\n\n`;
  t += `없는 내용을 지어내지 않으려고 확인드리는 겁니다\n`;
  t += `아시는 것만 편하게 답해주시면 됩니다 한 번에 다 안 주셔도 괜찮아요\n\n`;
  let n=1;
  Object.keys(groups).forEach(g=>{
    t += `[${g}]\n`;
    groups[g].forEach(q=>{ t += `${n}. ${q}\n`; n++; });
    t += `\n`;
  });
  t += `사진은 폰으로 찍으신 것도 좋습니다 매장 밖, 안, 메뉴나 작업 과정이 있으면 글이 훨씬 살아납니다\n\n`;
  t += `답변 주시면 초안 잡아서 보여드리겠습니다 감사합니다`;
  return t;
}

/* ---------- 받은 정보 정리 ---------- */
function saveForm(){
  const v=S.save;
  const f=(id,key,label,ph,ta)=>`
    <div class="field">
      <label class="lb" for="${id}">${label}</label>
      ${ta?`<textarea id="${id}" data-s="${key}" placeholder="${ph}">${esc(v[key])}</textarea>`
          :`<input type="text" id="${id}" data-s="${key}" value="${esc(v[key])}" placeholder="${ph}">`}
    </div>`;
  return `
  <div class="warn">
    <strong>여기 적힌 것만 글에 쓰입니다.</strong> 확인 안 된 내용은 비워두세요. 비워두면 그 부분은 글에서 빠집니다.
  </div>
  <div class="bar">
    <button class="btn" id="bSave">이 업체 저장</button>
    <select id="bLoad" style="flex:1;min-width:120px">
      <option value="">저장된 업체 불러오기</option>
      ${listSaved().map(n=>`<option>${esc(n)}</option>`).join('')}
    </select>
    <button class="btn" id="bDel">삭제</button>
  </div>

  <div class="card">
    <h2>기본 정보</h2>
    <p class="desc">글 마무리에 들어갈 내용입니다.</p>
    ${f('s-name','name','업체명','정확한 상호명')}
    <div class="field">
      <label class="lb" for="s-ind">업종</label>
      <select id="s-ind" data-s="industry">
        <option value="">선택 안 함</option>
        ${INDUSTRIES.map(x=>`<option ${v.industry===x?'selected':''}>${esc(x)}</option>`).join('')}
      </select>
    </div>
    ${f('s-addr','addr','주소','건물명·층까지')}
    <div class="row">
      ${f('s-hours','hours','영업시간','예: 10:00~19:00')}
      ${f('s-off','off','쉬는 날 · 브레이크타임','예: 매주 월요일 / 15:00~16:00')}
    </div>
    <div class="row">
      ${f('s-tel','tel','전화번호','')}
      ${f('s-park','park','주차','예: 가능 5대 / 불가')}
    </div>
    ${f('s-book','book','예약 방법','예: 네이버 예약 / 전화 예약')}
  </div>

  <div class="card">
    <h2>서비스</h2>
    ${f('s-menu','menu','대표 메뉴 · 서비스','줄바꿈으로 구분해서 적으세요',1)}
    ${f('s-price','price','가격 표기 방침','예: 가격 비공개, 문의로 표기 / 대표 메뉴만 공개')}
    ${f('s-feature','feature','다른 곳과 다른 점','사장님이 직접 말씀하신 내용 그대로',1)}
  </div>

  <div class="card">
    <h2>손님</h2>
    ${f('s-target','target','주로 오시는 분','나이대·상황')}
    ${f('s-faq','faq','자주 묻는 질문','줄바꿈으로 구분',1)}
    ${f('s-story','story','실제 있었던 일 · 계기','글에 쓸 수 있는 구체적 사례',1)}
  </div>

  <div class="card">
    <h2>자료와 제한</h2>
    ${f('s-photo','photo','사진','예: 외부 3장, 내부 5장, 메뉴 4장 받음')}
    ${f('s-ban','ban','쓰면 안 되는 표현 · 노출 금지','',1)}
    ${f('s-raw','raw','사장님 답변 원문','받은 카톡 내용을 그대로 붙여넣어도 됩니다',1)}
  </div>`;
}

function buildSave(){
  const v=S.save, L=[];
  const add=(k,label)=>{ if(v[k] && v[k].trim()) L.push(`- ${label}: ${v[k].trim()}`); };
  const addMulti=(k,label)=>{
    if(v[k] && v[k].trim()){
      L.push(`- ${label}:\n${v[k].split('\n').filter(x=>x.trim()).map(x=>'  · '+x.trim()).join('\n')}`);
    }
  };
  L.push('# 확인된 업체 정보');
  L.push('아래에 적힌 것만 사실로 취급한다. 여기 없는 내용은 절대 쓰지 않는다.');
  L.push('');
  add('name','업체명'); add('industry','업종'); add('addr','주소');
  add('hours','영업시간'); add('off','쉬는 날·브레이크타임');
  add('tel','전화번호'); add('park','주차'); add('book','예약 방법');
  addMulti('menu','대표 메뉴·서비스');
  add('price','가격 표기 방침');
  addMulti('feature','다른 곳과 다른 점');
  add('target','주로 오시는 분');
  addMulti('faq','자주 묻는 질문');
  addMulti('story','실제 있었던 일');
  add('photo','확보한 사진');
  addMulti('ban','쓰면 안 되는 표현');
  if(v.raw && v.raw.trim()){
    L.push('');
    L.push('# 사장님 답변 원문');
    L.push('"""');
    L.push(v.raw.trim());
    L.push('"""');
  }
  L.push('');
  L.push('# 사실 규칙');
  L.push('- 위에 없는 정보는 추측해서 쓰지 않는다.');
  L.push('- 필요한데 없으면 본문에 넣지 말고 [확인 필요]에 질문으로 남긴다.');
  L.push('- 특히 가격, 수상, 경력, 후기, 통계는 위에 없으면 절대 쓰지 않는다.');
  return L.join('\n');
}

/* ---------- 사실 점검 ---------- */
const CHECK_ITEMS = [
  ['name','업체명'],['addr','주소'],['hours','영업시간'],['tel','전화번호'],
  ['park','주차'],['menu','대표 메뉴·서비스'],['feature','다른 곳과 다른 점'],
  ['target','주로 오시는 분'],['faq','자주 묻는 질문'],['story','실제 있었던 일'],
  ['photo','사진 확보'],
];

function checkForm(){
  const v=S.save;
  const done=CHECK_ITEMS.filter(([k])=>v[k] && v[k].trim()).length;
  const total=CHECK_ITEMS.length;
  const pct=Math.round(done/total*100);
  return `
  <div class="card">
    <h2>준비 상태 ${done} / ${total}</h2>
    <p class="desc">${pct >= 80 ? '원고를 쓰기에 충분합니다.' : pct >= 50 ? '기본은 됐습니다. 빈 항목은 글에서 빼세요.' : '정보가 부족합니다. 질문지를 먼저 보내세요.'}</p>
    <ul class="checklist">
      ${CHECK_ITEMS.map(([k,label])=>{
        const ok = v[k] && v[k].trim();
        return `<li>
          <span class="mark ${ok?'yes':'no'}">${ok?'✓':'—'}</span>
          <span>${esc(label)}${ok?'':' <span style="color:var(--ink-3)">— 아직 없음</span>'}</span>
        </li>`;
      }).join('')}
    </ul>
  </div>
  <div class="warn">
    <strong>빈 항목은 글에 쓰지 마세요.</strong> 확인 안 된 내용을 채워 넣는 순간 그 글은 사장님 책임이 됩니다.
    특히 가격, 경력, 수상, 후기는 반드시 확인 후에만 씁니다.
  </div>`;
}

function buildCheck(){
  const v=S.save;
  const missing=CHECK_ITEMS.filter(([k])=>!(v[k]&&v[k].trim()));
  if(!missing.length) return '확인이 필요한 항목이 없습니다. 바로 원고를 쓰셔도 됩니다.';
  let t=`사장님 원고 쓰다가 확인이 더 필요한 부분이 있어서 여쭤봅니다\n\n`;
  missing.forEach((m,i)=>{ t += `${i+1}. ${m[1]}\n`; });
  t += `\n이 부분은 확인되기 전까지 글에 넣지 않겠습니다 아시는 대로만 알려주세요`;
  return t;
}

/* ---------- 저장 ---------- */
function listSaved(){
  try{ return Object.keys(JSON.parse(Store.get('cb_saved')||'{}')); }catch(e){ return []; }
}
function saveOne(){
  const n=(S.save.name||'').trim();
  if(!n){ toast('업체명을 먼저 입력해줘'); return; }
  let all={}; try{ all=JSON.parse(Store.get('cb_saved')||'{}'); }catch(e){}
  all[n]={...S.save};
  Store.set('cb_saved',JSON.stringify(all));
  toast(Store.ok?`"${n}" 저장했어`:'이 화면에선 임시 저장만 돼');
  render();
}
function loadOne(n){
  if(!n) return;
  let all={}; try{ all=JSON.parse(Store.get('cb_saved')||'{}'); }catch(e){}
  if(all[n]){ S.save={...S.save,...all[n]}; render(); toast(`"${n}" 불러왔어`); }
}
function delOne(){
  const n=(S.save.name||'').trim();
  let all={}; try{ all=JSON.parse(Store.get('cb_saved')||'{}'); }catch(e){}
  if(!all[n]){ toast('저장된 업체가 아니야'); return; }
  delete all[n]; Store.set('cb_saved',JSON.stringify(all));
  toast(`"${n}" 삭제했어`); render();
}

/* ---------- 렌더 ---------- */
function render(){
  const f=$('#form');
  f.innerHTML = S.tab==='ask' ? askForm() : S.tab==='save' ? saveForm() : checkForm();
  bind();
  renderOut();
}
function renderOut(){
  const text = S.tab==='ask' ? buildAsk() : S.tab==='save' ? buildSave() : buildCheck();
  const title = S.tab==='ask' ? '사장님께 보낼 질문지'
              : S.tab==='save' ? '원고 프롬프트에 넣을 정보'
              : '추가로 물어볼 것';
  $('#out').innerHTML = `
    <div class="out">
      <div class="out-top">
        <span class="t">${title}</span>
        <span class="n">${text.length.toLocaleString()}자</span>
        <button class="btn primary" id="btnCopy">복사</button>
      </div>
      <pre>${esc(text)}</pre>
    </div>`;
  $('#mCount').textContent = text.length.toLocaleString()+'자';
  window.__t = text;
  $('#btnCopy').addEventListener('click',copyOut);
}
function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{ S.ask[el.dataset.a]=e.target.value; renderOut(); });
  });
  document.querySelectorAll('[data-s]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{ S.save[el.dataset.s]=e.target.value; renderOut(); });
  });
  const bs=$('#bSave'); if(bs) bs.addEventListener('click',saveOne);
  const bl=$('#bLoad'); if(bl) bl.addEventListener('change',e=>loadOne(e.target.value));
  const bd=$('#bDel'); if(bd) bd.addEventListener('click',delOne);
}
async function copyOut(){
  const t=window.__t||'';
  if(!t.trim()){ toast('복사할 내용이 없어'); return; }
  try{ await navigator.clipboard.writeText(t); toast('복사 완료'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('복사 완료'); }catch(e2){ toast('길게 눌러 직접 선택해줘'); }
    document.body.removeChild(ta);
  }
}
let tt;
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1800); }

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
    S.tab=t.dataset.tab; render(); $('#form').scrollTop=0;
  });
});
$('#btnOpenM').addEventListener('click',()=>{ $('#out').classList.add('open'); $('#btnCloseM').style.display='inline-block'; });
$('#btnCloseM').addEventListener('click',()=>{ $('#out').classList.remove('open'); $('#btnCloseM').style.display='none'; });

render();
</script>
</body>
