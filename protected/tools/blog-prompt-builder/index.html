<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원고 프롬프트 빌더 — 바이란미디어</title>
<style>
:root{
  --bg:#F2F4F3;
  --surface:#FFFFFF;
  --line:#DCE1DF;
  --line-soft:#E9EDEB;
  --ink:#161D1A;
  --ink-2:#5A6663;
  --ink-3:#8A9793;
  --accent:#2F6F5E;
  --accent-soft:#E4F0EB;
  --warn:#A8641C;
  --warn-soft:#FBF1E3;
  --danger:#A93E33;
  --danger-soft:#FAEBE9;
  --panel:#14181A;
  --panel-2:#1D2326;
  --panel-line:#2C3438;
  --panel-ink:#D6DEDA;
  --panel-dim:#66756F;
  --panel-accent:#6FC2A4;
  --radius:10px;
  --mono:'SF Mono','JetBrains Mono','D2Coding',Consolas,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 20px 0;
  flex-shrink:0;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.02em}
.brand .sub{font-size:12px;color:var(--ink-3);letter-spacing:.01em}
.brand .badge{
  margin-left:auto;font-size:11px;color:var(--accent);
  background:var(--accent-soft);padding:3px 9px;border-radius:20px;font-weight:600;
}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;padding:9px 15px 11px;cursor:pointer;
  font-size:13.5px;font-weight:550;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .12s;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);flex:1;min-height:0}

/* ---------- form side ---------- */
.form{overflow-y:auto;padding:18px 20px 120px;border-right:1px solid var(--line)}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
}
.card>summary{
  list-style:none;cursor:pointer;padding:12px 14px;
  display:flex;align-items:center;gap:9px;
  font-size:13.5px;font-weight:600;user-select:none;
}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{
  content:'';width:6px;height:6px;border-right:1.6px solid var(--ink-3);
  border-bottom:1.6px solid var(--ink-3);transform:rotate(-45deg);
  transition:transform .15s;margin-left:2px;
}
.card[open]>summary::before{transform:rotate(45deg)}
.card>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card .tag{
  margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);
  background:var(--bg);padding:2px 8px;border-radius:20px;
}
.card .tag.on{color:var(--accent);background:var(--accent-soft)}
.card-in{padding:2px 14px 15px;border-top:1px solid var(--line-soft)}

.field{margin-top:13px}
label.lb{
  display:block;font-size:11px;font-weight:650;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
label.lb .req{color:var(--danger);margin-left:3px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
input[type=text],select,textarea{
  width:100%;padding:9px 11px;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;
  transition:border-color .12s,box-shadow .12s;
}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238A9793' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chip choices */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:6px 11px;border:1px solid var(--line);background:var(--surface);
  border-radius:20px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
  transition:all .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* regulation preview */
.reg{
  margin-top:13px;border-radius:8px;padding:11px 12px;
  background:var(--danger-soft);border:1px solid #EFD6D2;
}
.reg.none{background:var(--accent-soft);border-color:#CFE5DC}
.reg h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--danger);margin-bottom:7px}
.reg.none h4{color:var(--accent)}
.reg .words{display:flex;flex-wrap:wrap;gap:4px}
.reg .w{
  font-size:11.5px;background:rgba(255,255,255,.75);color:var(--danger);
  padding:2px 7px;border-radius:4px;font-weight:550;
}
.reg .note{font-size:11.5px;color:var(--ink-2);margin-top:8px;line-height:1.5}

/* profile bar */
.profbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.profbar select{flex:1;min-width:130px}
.btn{
  padding:8px 13px;border:1px solid var(--line);background:var(--surface);
  border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#265A4C;border-color:#265A4C;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}

.storewarn{
  font-size:11.5px;color:var(--warn);background:var(--warn-soft);
  border:1px solid #EEDFC4;border-radius:7px;padding:8px 10px;margin-bottom:12px;line-height:1.5;
}

/* ---------- output side ---------- */
.out{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.out-top{
  padding:13px 18px;border-bottom:1px solid var(--panel-line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;
}
.out-top .ttl{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--panel-dim);
}
.out-top .count{font-family:var(--mono);font-size:11px;color:var(--panel-dim);margin-left:auto}
.out-top .btn{background:var(--panel-2);border-color:var(--panel-line);color:var(--panel-ink)}
.out-top .btn:hover{border-color:var(--panel-accent);color:var(--panel-accent)}
.out-top .btn.primary{background:var(--panel-accent);border-color:var(--panel-accent);color:#0E1412}
.out-top .btn.primary:hover{background:#8AD4B9;border-color:#8AD4B9;color:#0E1412}

.mode{display:flex;gap:0;border:1px solid var(--panel-line);border-radius:7px;overflow:hidden}
.mode button{
  background:none;border:none;padding:6px 11px;font-size:11.5px;font-weight:600;
  color:var(--panel-dim);cursor:pointer;transition:all .12s;
}
.mode button[aria-pressed="true"]{background:var(--panel-2);color:var(--panel-accent)}
.mode button:focus-visible{outline:2px solid var(--panel-accent);outline-offset:-2px}

.out-body{overflow-y:auto;padding:16px 18px 40px;flex:1;min-height:0}
.blk{
  border-left:2px solid var(--panel-line);padding:0 0 0 13px;margin-bottom:18px;
  animation:slide .22s ease-out;
}
@keyframes slide{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.blk{animation:none}*{transition:none!important}}
.blk.auto{border-left-color:var(--panel-accent)}
.blk.warn{border-left-color:#C4913E}
.blk .bl{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--panel-dim);margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.blk.auto .bl{color:var(--panel-accent)}
.blk.warn .bl{color:#C4913E}
.blk .bl .auto-mark{
  font-size:9px;background:rgba(111,194,164,.14);padding:1px 6px;border-radius:3px;letter-spacing:.05em;
}
.blk pre{
  font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--panel-ink);
  white-space:pre-wrap;word-break:break-word;
}
.empty{
  color:var(--panel-dim);font-size:13px;text-align:center;padding:50px 20px;line-height:1.8;
}
.empty strong{color:var(--panel-ink);display:block;margin-bottom:6px;font-weight:600}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(70px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:all .22s cubic-bezier(.2,.9,.3,1);z-index:90;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- mobile ---------- */
.mobile-bar{display:none}
@media (max-width:860px){
  .body{grid-template-columns:1fr}
  .form{border-right:none;padding-bottom:150px}
  .out{
    position:fixed;inset:0;top:auto;height:82dvh;z-index:60;
    border-radius:16px 16px 0 0;transform:translateY(101%);
    transition:transform .26s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 -8px 40px rgba(0,0,0,.28);
  }
  .out.open{transform:translateY(0)}
  .out-top{padding-top:16px;position:relative}
  .out-top::before{
    content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:34px;height:3px;border-radius:2px;background:var(--panel-line);
  }
  .mobile-bar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:8px;align-items:center;
  }
  .mobile-bar .info{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
  .mobile-bar .btn{margin-left:auto}
  .backdrop{
    display:none;position:fixed;inset:0;background:rgba(10,14,13,.45);z-index:55;
  }
  .backdrop.on{display:block}
  header{padding:12px 14px 0}
  .form{padding-left:14px;padding-right:14px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>원고 프롬프트 빌더</h1>
      <span class="sub">바이란미디어</span>
      <span class="badge">인터넷 없이 동작</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="blog">블로그 원고</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="threads">스레드</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="review">원고 검수</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="keyword">키워드 리서치</button>
    </div>
  </header>

  <div class="body">
    <div class="form" id="form"></div>

    <aside class="out" id="out">
      <div class="out-top">
        <span class="ttl" id="outTitle">완성된 프롬프트</span>
        <div class="mode" id="modeSwitch">
          <button data-mode="full" aria-pressed="true">전체 요청문</button>
          <button data-mode="system" aria-pressed="false">GPTs 고정지침</button>
        </div>
        <span class="count" id="count">0자</span>
        <button class="btn" id="btnClose" style="display:none">닫기</button>
        <button class="btn primary" id="btnCopy">복사</button>
      </div>
      <div class="out-body" id="outBody"></div>
    </aside>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="mobile-bar">
    <span class="info" id="mCount">0자</span>
    <button class="btn primary" id="btnOpen">프롬프트 보기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   저장소 — localStorage 사용 불가 환경에서도 안 깨지게 폴백
   ============================================================ */
const Store = {
  ok:false, mem:{},
  init(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); this.ok=true; }catch(e){ this.ok=false; } },
  get(k){ if(this.ok){ try{ return localStorage.getItem(k); }catch(e){} } return this.mem[k] ?? null; },
  set(k,v){ if(this.ok){ try{ localStorage.setItem(k,v); return; }catch(e){} } this.mem[k]=v; }
};
Store.init();

/* ============================================================
   업종별 규제 데이터 — 07번 금지표현 사전 기반
   ============================================================ */

function regBox(ind){
  if(!ind || ind.banned.length===0){
    return `<div class="reg none"><h4>공통 규제만 적용</h4>
      <div class="words">${COMMON_BANNED.slice(0,8).map(w=>`<span class="w" style="color:var(--accent)">${esc(w)}</span>`).join('')}</div>
      <div class="note">업종을 고르면 해당 법령 기준이 추가로 붙어.</div></div>`;
  }
  return `<div class="reg">
    <h4>이 업종에서 쓰면 안 되는 표현 (${ind.banned.length}개)</h4>
    <div class="words">${ind.banned.map(w=>`<span class="w">${esc(w)}</span>`).join('')}</div>
    ${ind.note?`<div class="note">${esc(ind.note)}</div>`:''}
  </div>`;
}

function B(label,text,kind){ return text && text.trim() ? {label,text:text.trim(),kind:kind||''} : null; }

function regulationText(){
  const ind = INDUSTRY[S.p.industry];
  let t = `## 절대 금지 (하나라도 쓰면 실패)\n${COMMON_BANNED.join(' / ')}\n\n## 대체 원칙\n1. 최상급을 쓰고 싶으면 → 검증 가능한 사실로 바꾼다.\n   "최고의 기술" → "이 방식으로 8년째 작업하고 있습니다"\n2. 효과를 말하고 싶으면 → 과정을 말한다.\n3. 결과를 언급했으면 → 개인차 문구로 닫는다.\n4. 홍보 문장은 정보 문장으로 바꾼다.\n   "지금 바로 전화주세요" → "궁금한 점은 편하게 물어보셔도 됩니다"`;

  if(ind && ind.banned.length){
    t += `\n\n## 업종 추가 금지 — ${ind.label}\n근거: ${ind.law}\n${ind.banned.join(' / ')}`;
    if(ind.swap.length){
      t += `\n\n## 이 업종 대체 표현\n` + ind.swap.map(([a,b])=>`- ${a} → ${b}`).join('\n');
    }
    if(ind.note) t += `\n\n## 주의\n${ind.note}`;
    if(ind.closing) t += `\n\n## 글 마무리에 반드시 삽입할 문구\n"${ind.closing}"`;
  }
  return t;
}

function profileBlock(){
  const p=S.p, L=[];
  if(p.name) L.push(`- 업체명: ${p.name}`);
  if(INDUSTRY[p.industry] && p.industry!=='none') L.push(`- 업종: ${INDUSTRY[p.industry].label}`);
  if(p.region) L.push(`- 지역·상권: ${p.region}`);
  if(p.services) L.push(`- 대표 서비스:\n${p.services.split('\n').filter(x=>x.trim()).map(x=>'  · '+x.trim()).join('\n')}`);
  if(p.target) L.push(`- 타겟 고객: ${p.target}`);
  if(p.tone) L.push(`- 브랜드 톤: ${p.tone}`);
  if(p.diff) L.push(`- 차별점: ${p.diff}`);
  if(p.ban) L.push(`- 사장님 요청 (반드시 지킬 것): ${p.ban}`);
  if(p.info) L.push(`- 마무리에 넣을 정보: ${p.info}`);
  if(p.assets) L.push(`- 사용 가능한 실제 소재 (이 범위 안에서만 구체적 서술을 만들 것):\n${p.assets.split('\n').filter(x=>x.trim()).map(x=>'  · '+x.trim()).join('\n')}`);
  return L.join('\n');
}

  if(k.area||S.p.region) info.push(`- 공략 지역: ${k.area||S.p.region}`);
  if(S.p.services) info.push(`- 대표 서비스:\n${S.p.services.split('\n').filter(x=>x.trim()).map(x=>'  · '+x.trim()).join('\n')}`);
  if(k.target||S.p.target) info.push(`- 검색하는 사람의 상황: ${k.target||S.p.target}`);
  if(k.season) info.push(`- 이번 달 시즌 이슈: ${k.season}`);
  out.push(B('대상','# 대상\n'+info.join('\n')));

  out.push(B('요청',`# 요청
1. 메인 키워드 후보 10개
   형식: [키워드 | 예상 검색의도 | 경쟁강도 추정(상/중/하) | 추천도]
2. 롱테일 키워드 ${k.count}개
   분류: 지역명+서비스형 / 상황형 / 비교형 / 가격형 / 질문형
3. 이번 달 발행 계획표
   형식: [회차 | 목표 키워드 | 제목안 | 콘텐츠 유형(정보/후기/비교/사례)]
4. 피해야 할 키워드와 이유`,'auto'));

  out.push(B('주의',`# 주의
- 실제 검색량 수치는 추정치임을 명시하고, 확정 수치처럼 쓰지 않는다.
- 결과 하단에 "네이버 키워드도구 또는 블랙키위로 교차검증이 필요합니다"를 반드시 붙인다.
- 규제 업종의 경우, 광고 심의에서 문제가 될 수 있는 키워드는 따로 표시한다.`));
  return out.filter(Boolean);
}

function build(){
  if(S.tab==='blog') return buildBlog();
  if(S.tab==='threads') return buildThreads();
  if(S.tab==='review') return buildReview();
  return buildKeyword();
}

/* ============================================================
   렌더
   ============================================================ */
function renderForm(){
  const f=$('#form');
  f.innerHTML = S.tab==='blog'?blogForm() : S.tab==='threads'?threadsForm() : S.tab==='review'?reviewForm() : keywordForm();
  bindForm();
}

function renderOut(){
  const blocks=build();
  const text=blocks.map(b=>b.text).join('\n\n');
  const body=$('#outBody');

  const needs = S.tab==='blog' ? (!S.p.name||!S.blog.main)
              : S.tab==='threads' ? (!S.threads.concept)
              : S.tab==='review' ? (!S.review.draft)
              : false;

  if(needs && blocks.length<3){
    body.innerHTML=`<div class="empty"><strong>왼쪽을 채우면 여기에 프롬프트가 만들어져</strong>업체명과 키워드부터 넣어봐.<br>업종을 고르면 법령 규제가 자동으로 붙어.</div>`;
  }else{
    body.innerHTML = blocks.map(b=>`
      <div class="blk ${b.kind}">
        <div class="bl">${esc(b.label)}${b.kind==='auto'?'<span class="auto-mark">자동 삽입</span>':''}</div>
        <pre>${esc(b.text)}</pre>
      </div>`).join('');
  }
  const n=text.length.toLocaleString();
  $('#count').textContent=n+'자';
  $('#mCount').textContent=n+'자';
  $('#outTitle').textContent = S.mode==='system'?'GPTs 지침에 넣을 고정 프롬프트':'GPT 대화창에 붙여넣을 요청문';
  window.__promptText=text;
}

function render(){ renderForm(); renderOut(); }

/* ============================================================
   이벤트
   ============================================================ */
function bindForm(){
  document.querySelectorAll('[data-p]').forEach(el=>{
    const k=el.dataset.p;
    el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{
      S.p[k]=e.target.value;
      if(k==='industry'){ render(); openCard('prof'); } else renderOut();
    });
  });
  ['b','t','r','k'].forEach(pre=>{
    const map={b:'blog',t:'threads',r:'review',k:'keyword'};
    document.querySelectorAll(`[data-${pre}]`).forEach(el=>{
      const k=el.dataset[pre];
      el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{
        S[map[pre]][k]=e.target.value; renderOut();
        const tag=el.closest('.card')?.querySelector('.tag');
        if(tag && pre==='r' && k==='draft'){ tag.textContent = e.target.value ? e.target.value.length+'자':'붙여넣기 필요'; tag.classList.toggle('on',!!e.target.value); }
      });
    });
  });
  document.querySelectorAll('[data-chip]').forEach(el=>{
    el.addEventListener('click',()=>{
      const [g,k]=el.dataset.chip.split('.');
      S[g][k]=el.dataset.val;
      el.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===el));
      renderOut();
    });
  });
  const sel=$('#profSel'); if(sel) sel.addEventListener('change',e=>loadProfile(e.target.value));
  const sv=$('#profSave'); if(sv) sv.addEventListener('click',saveProfile);
  const dl=$('#profDel'); if(dl) dl.addEventListener('click',delProfile);
}

function openCard(name){
  const c=document.querySelector(`[data-card="${name}"]`); if(c) c.open=true;
}

/* 프로필 저장 */
function listProfiles(){
  try{ return JSON.parse(Store.get('rp_profiles')||'{}') && Object.keys(JSON.parse(Store.get('rp_profiles')||'{}')); }catch(e){ return []; }
}
function saveProfile(){
  const name=(S.p.name||'').trim();
  if(!name){ toast('업체명을 먼저 입력해줘'); return; }
  let all={}; try{ all=JSON.parse(Store.get('rp_profiles')||'{}'); }catch(e){}
  all[name]={...S.p};
  Store.set('rp_profiles',JSON.stringify(all));
  S.profileName=name;
  toast(Store.ok?`"${name}" 저장했어`:'이 화면에선 임시 저장만 돼');
  render();
}
function loadProfile(name){
  if(!name) return;
  let all={}; try{ all=JSON.parse(Store.get('rp_profiles')||'{}'); }catch(e){}
  if(all[name]){ S.p={...S.p,...all[name]}; S.profileName=name; render(); toast(`"${name}" 불러왔어`); }
}
function delProfile(){
  if(!S.profileName){ toast('불러온 고객사가 없어'); return; }
  let all={}; try{ all=JSON.parse(Store.get('rp_profiles')||'{}'); }catch(e){}
  delete all[S.profileName]; Store.set('rp_profiles',JSON.stringify(all));
  toast(`"${S.profileName}" 삭제했어`); S.profileName=''; render();
}

/* 복사 */
async function copyPrompt(){
  const t=window.__promptText||'';
  if(!t.trim()){ toast('아직 만들 내용이 없어'); return; }
  try{ await navigator.clipboard.writeText(t); toast('복사 완료. GPT에 붙여넣어'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('복사 완료'); }catch(e2){ toast('복사가 안 돼. 길게 눌러 직접 선택해줘'); }
    document.body.removeChild(ta);
  }
}

let toastT;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1900);
}

/* 탭 */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
    S.tab=t.dataset.tab;
    const ms=$('#modeSwitch');
    ms.style.display = (S.tab==='blog'||S.tab==='threads') ? 'flex':'none';
    if(ms.style.display==='none') S.mode='full';
    render();
    $('#form').scrollTop=0;
  });
});

/* 모드 */
document.querySelectorAll('#modeSwitch button').forEach(b=>{
  b.addEventListener('click',()=>{
    S.mode=b.dataset.mode;
    document.querySelectorAll('#modeSwitch button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    renderOut();
  });
});

$('#btnCopy').addEventListener('click',copyPrompt);

/* 모바일 시트 */
const out=$('#out'), bd=$('#backdrop');
$('#btnOpen').addEventListener('click',()=>{ out.classList.add('open'); bd.classList.add('on'); $('#btnClose').style.display='inline-block'; });
function closeSheet(){ out.classList.remove('open'); bd.classList.remove('on'); }
$('#btnClose').addEventListener('click',closeSheet);
bd.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

render();
</script>
</body>
</html>
