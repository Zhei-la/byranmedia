<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루월당 사주</title>
<style>
  :root{
    --bg:#F2F4F3; --surface:#fff; --line:#DCE1DF;
    --ink:#161D1A; --ink-2:#5A6663; --ink-3:#8A9793;
    --accent:#2F6F5E; --accent-dark:#265A4C; --accent-soft:#E4F0EB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.65;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:36px 30px; max-width:420px; width:100%; text-align:center;
  }
  .ico{font-size:38px; line-height:1; margin-bottom:16px}
  h1{font-size:20px; font-weight:700; letter-spacing:-.025em; margin-bottom:8px}
  p{font-size:14px; color:var(--ink-2); margin-bottom:24px}
  .go{
    display:block; width:100%; padding:13px; background:var(--accent); color:#fff;
    border:none; border-radius:8px; font-size:15px; font-weight:650;
    text-decoration:none; cursor:pointer; transition:background .13s;
  }
  .go:hover{background:var(--accent-dark)}
  .go:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .note{
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-3); line-height:1.6; text-align:left;
  }
  .note strong{color:var(--ink-2); font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <div class="ico">🔮</div>
    <h1>루월당 사주</h1>
    <p>사주 리포트 발행 플랫폼으로 이동합니다.</p>
    <a class="go" href="https://www.luwolsaju.com/home" target="_blank" rel="noopener">루월당 열기</a>
    <div class="note">
      <strong>카카오톡 로그인이 필요합니다.</strong><br>
      루월당은 별도 계정으로 운영돼요. 처음 한 번만 로그인하면 이후에는 바로 들어갈 수 있습니다.
    </div>
  </main>
</body>
</html>
